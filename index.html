<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xinjian Zhang</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='55' font-size='80' text-anchor='middle' fill='%23323232' font-family='Arial, sans-serif'>X</text></svg>" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0eafc, #cfdef3);
      transition: background 0.7s ease;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #232526, #414345);
      }
    }
    .background-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 12s ease-in-out infinite alternate;
    }
    .b1 { width: 300px; height: 300px; background: #a1c4fd; top: 5%; left: 10%; }
    .b2 { width: 250px; height: 250px; background: #fbc2eb; bottom: 10%; right: 15%; animation-delay: 3s; }
    .b3 { width: 200px; height: 200px; background: #fda085; top: 40%; right: 25%; animation-delay: 6s; }
    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.05); }
    }
    .content {
      position: relative;
      z-index: 1;
      font-family: Arial, sans-serif;
      font-size: 1.5rem;
      color: #333;
      text-decoration: none;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 1rem;
      backdrop-filter: blur(10px);
    }
    @media (max-width: 600px) {
      .content {
        font-size: 1.2rem;
        padding: 0.8rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="background-blob b1"></div>
  <div class="background-blob b2"></div>
  <div class="background-blob b3"></div>
  <a href="https://xinjianzhang.com" class="content">xinjianzhang.com</a>
</body>
</html>

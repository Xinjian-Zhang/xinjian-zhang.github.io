<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Xinjian Zhang</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/20927683?v=4">
  <style>
    html, body { height: 100%; }
    body { min-height: 100vh; }
    
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.5;
      z-index: 0;
      animation: float 12s ease-in-out infinite alternate;
    }
    .blob1 { top: 10%; left: 12%; width: 360px; height: 360px; background: #a1c4fd; }
    .blob2 { top: 60%; left: 60%; width: 340px; height: 340px; background: #fbc2eb; animation-delay: 2s; }
    .blob3 { top: 40%; left: 70%; width: 240px; height: 240px; background: #fda085; animation-delay: 4s;}
    @keyframes float {
      0%   { transform: translateY(0) scale(1);}
      100% { transform: translateY(-30px) scale(1.07);}
    }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center bg-gradient-to-br from-[#e0eafc] to-[#cfdef3] dark:from-[#232526] dark:to-[#414345] transition-colors duration-700">

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <main class="z-10 relative w-full max-w-xs sm:max-w-md mx-auto p-8 flex flex-col items-center gap-8 rounded-3xl bg-white/40 dark:bg-black/40 shadow-2xl backdrop-blur-xl">
    <div id="avatar" class="rounded-full w-20 h-20 border-2 border-white shadow-xl overflow-hidden mb-2 bg-gradient-to-br from-indigo-200 to-pink-200">
      <img src="https://avatars.githubusercontent.com/u/117434829?v=4" alt="avatar" class="w-full h-full object-cover" />
    </div>
    <h1 id="intro" class="text-xl sm:text-2xl font-semibold text-center text-gray-900 dark:text-white tracking-tight select-none">
      Hi, I am Xinjian Zhang.
    </h1>
    <div class="flex gap-4 items-center mt-2">
      <button class="lang-btn group w-10 h-10 flex items-center justify-center rounded-full shadow bg-white/60 dark:bg-gray-800/70 backdrop-blur-md border border-white/40 transition hover:scale-110 hover:bg-indigo-200/80 focus:outline-none"
        data-lang="en" aria-label="English">
        <span class="text-base font-bold text-blue-500 group-hover:text-blue-700">EN</span>
      </button>
      <button class="lang-btn group w-10 h-10 flex items-center justify-center rounded-full shadow bg-white/60 dark:bg-gray-800/70 backdrop-blur-md border border-white/40 transition hover:scale-110 hover:bg-pink-200/80 focus:outline-none"
        data-lang="zh" aria-label="中文">
        <span class="text-base font-bold text-pink-500 group-hover:text-pink-700">中</span>
      </button>
      <button class="lang-btn group w-10 h-10 flex items-center justify-center rounded-full shadow bg-white/60 dark:bg-gray-800/70 backdrop-blur-md border border-white/40 transition hover:scale-110 hover:bg-orange-200/80 focus:outline-none"
        data-lang="tr" aria-label="Türkçe">
        <span class="text-base font-bold text-orange-500 group-hover:text-orange-700">TR</span>
      </button>
      <hr>
      <a href="https://github.com/Xinjian-Zhang" target="_blank" rel="noopener" class="group w-10 h-10 flex items-center justify-center rounded-full shadow bg-white/60 dark:bg-gray-800/70 backdrop-blur-md border border-white/40 transition hover:scale-110 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none"
        aria-label="GitHub">
        <i data-lucide="github" class="w-5 h-5 text-gray-800 dark:text-gray-200 group-hover:text-indigo-500"></i>
      </a>
      <a href="mailto:1xinjian.zhang@gmail.com" class="group w-10 h-10 flex items-center justify-center rounded-full shadow bg-white/60 dark:bg-gray-800/70 backdrop-blur-md border border-white/40 transition hover:scale-110 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none"
        aria-label="Email">
        <i data-lucide="mail" class="w-5 h-5 text-gray-800 dark:text-gray-200 group-hover:text-rose-500"></i>
      </a>
    </div>
  </main>

  <script>
    gsap.to("#avatar", { y: -8, repeat: -1, yoyo: true, duration: 1.5, ease: "sine.inOut" });
    lucide.createIcons();
    const introTexts = {
      en: "Hi, I am Xinjian Zhang.",
      zh: "你好，我是张新健。",
      tr: "Merhaba, ben Xinjian Zhang."
    };
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.onclick = () => {
        const lang = btn.dataset.lang;
        document.getElementById('intro').textContent = introTexts[lang] || introTexts['en'];
      }
    });
  </script>
</body>
</html>
